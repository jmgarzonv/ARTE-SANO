<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi E-commerce{% endblock %}</title>

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header class="bg-dark text-white p-3 mb-4">
        <div class="container">
            <h1 class="h3">Bienvenido a la tienda de artesanías</h1>
            <nav class="mt-2">
                <a href="{% url 'lista_productos' %}" class="btn btn-outline-light btn-sm">Inicio</a>
                <a href="{% url 'crear_producto' %}" class="btn btn-outline-light btn-sm">Nuevo Producto</a>
                <a href="{% url 'ver_wishlist' %}" class="btn btn-outline-danger btn-sm">❤️ Wishlist</a>
                <a href="{% url 'ver_carrito' %}" class="btn btn-outline-success btn-sm">🛒 Carrito</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS (opcional si usarás componentes interactivos como modales, tooltips, etc) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
