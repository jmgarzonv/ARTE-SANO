{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 85vh;">
    <div class="card p-4 shadow-lg" style="width: 100%; max-width: 500px;">
        <h2 class="text-center mb-4">Registro</h2>

        <form method="POST" action="{% url 'registro' %}" novalidate>
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    {{ field.label_tag }}
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small">
                            {{ field.errors|striptags }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}

            <div class="d-grid">
                <button type="submit" class="btn btn-success">Registrarse</button>
            </div>
        </form>

        <div class="mt-3 text-center">
            <a href="{% url 'iniciar_sesion' %}" class="text-decoration-none">¿Ya tienes cuenta? <strong>Inicia sesión</strong></a>
        </div>
    </div>
</div>
{% endblock %}
